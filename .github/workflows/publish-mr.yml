# .github/workflows/docker.yml
name: Build & Push

on:
  push:
    branches: [master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME_MR }}
          password: ${{ secrets.DOCKERHUB_TOKEN_MR }}
      - uses: docker/build-push-action@v6
        with:
          push: true
          tags: |
            paulomresults/br.boleto.extractor:latest
#            seudockerhub/docextractor-api:${{ github.sha }}